services:
  - type: web
    name: promop
    runtime: python
    repo: https://github.com/healthkey-ai/promop
    branch: main
    autoDeploy: true
    # This shared Blueprint can advance on dev while production stays on an
    # older main revision. Validate catalog payloads when that revision ships
    # the verifier; a verifier failure must still stop the build.
    buildCommand: "if [ -f scripts/verify_source_catalog_snapshots.py ]; then python scripts/verify_source_catalog_snapshots.py; fi && pip install -r requirements.txt && if [ -f scripts/install_athena_browser.py ]; then python scripts/install_athena_browser.py; fi && cd frontend && npm install && npm run build && cd .. && python manage.py collectstatic --noinput"
    startCommand: "chmod +x start.sh && ./start.sh"
    envVars:
      # Keep Chromium inside the deployed Python environment, not a build-only cache.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: SECRET_KEY
        generateValue: true
      # Required by patient_portal.E001/E002/E003, which start.sh enforces
      # before migrate. Without these a service created from this blueprint —
      # a DR rebuild, a second environment, a preview — hard-fails at boot.
      # Independent values: audit tamper-evidence and export signatures are
      # separate controls, and must not share a key with each other or with
      # SECRET_KEY. Rotation procedure: docs/signing-key-rotation.md.
      - key: AUDIT_HMAC_KEY
        generateValue: true
      - key: EXPORT_SIGNING_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: promop-db
          property: connectionString
      # Deliberately dashboard-managed, not wired from the blueprint. Setting
      # it here would make production the first place the queued path ever
      # runs. Paste the redis connection string in once the path has been
      # exercised somewhere else; clearing it is the rollback.
      - key: CELERY_BROKER_URL
        sync: false

      # Used once when migration 0201 is pending and any of its target LOINC
      # concepts are absent. The bounded bootstrap scans the archive but inserts
      # only those concepts; full vocabulary loads are separate maintenance.
      - key: ATHENA_VOCABULARY_GDRIVE_URL
        sync: false

      # Required on deployments, including staging with DEBUG=True.
      # Render's environment marker enables the settings guard independently
      # of DEBUG; its supplied hostname can satisfy ALLOWED_HOSTS.
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ── Application configuration ────────────────────────────────────────
      # sync: false means Render prompts for the value rather than storing it
      # here. Deliberate: this repository is public, and CLAUDE.md forbids
      # committing hostnames and connection strings.
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # ── Secrets — never values in a blueprint ────────────────────────────
      - key: ADMIN_PASSWORD
        sync: false
      - key: SERVICE_AUTH_TOKEN
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_SENDER_DOMAIN
        sync: false

      # ── PHR federation ───────────────────────────────────────────────────
      # PHR_AUDIENCE is a shared constant, not a secret: phr stamps it as the
      # token's `aud` and PROMOP requires the match. Both sides must agree, so
      # it is pinned here rather than left to a dashboard entry. An unset value
      # fails CLOSED and rejects every PHR token — see healthkey-ai/phr#65,
      # which must land before this does anything but reject.
      - key: PHR_AUDIENCE
        value: promop-api
      - key: PHR_BASE_URL
        sync: false

      # Unset means Sentry stays off, which is also the rollback.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # The flag that decides whether webhooks do anything. Operator-controlled
      # (sync: false) so it is flipped in one place; the worker pulls this exact
      # value, because a web service publishing events while its worker has the
      # flag off leaves every delivery pending with no error anywhere.
      - key: WEBHOOKS_ENABLED
        sync: false

  - type: worker
    name: promop-worker
    runtime: python
    repo: https://github.com/healthkey-ai/promop
    branch: main
    autoDeploy: true
    # No frontend build: the worker serves nothing.
    buildCommand: "if [ -f scripts/verify_source_catalog_snapshots.py ]; then python scripts/verify_source_catalog_snapshots.py; fi && pip install -r requirements.txt && if [ -f scripts/install_athena_browser.py ]; then python scripts/install_athena_browser.py; fi"
    # Same entrypoint as staging: it refuses to boot without a broker, database
    # and signing key that match the web service, and it is the only path that
    # can start embedded beat.
    startCommand: "bash start-worker.sh"
    # Beat is a singleton. Stated as configuration rather than as a comment, so
    # scaling this service cannot quietly give the deployment N schedulers.
    numInstances: 1
    envVars:
      # Keep Chromium inside the deployed Python environment, not a build-only cache.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: PYTHON_VERSION
        value: 3.12.13
      # Exactly one scheduler per deployment. This service runs a single
      # replica; scaling it up means moving beat to its own service rather than
      # raising the replica count. Without it the recovery sweep never runs:
      # deliveries stranded by a broker outage and expired leases are never
      # reclaimed, and webhook history is never pruned.
      - key: CELERY_EMBEDDED_BEAT
        value: "true"
      # Pinned to what this service already ran. start-worker.sh defaults to 1
      # for the embedding-model workers on the small staging instance; leaving
      # it unset here would quietly cut production concurrency from 4 to 1.
      - key: CELERY_WORKER_CONCURRENCY
        value: "4"
      - key: WEBHOOKS_ENABLED
        fromService:
          name: promop
          type: web
          envVarKey: WEBHOOKS_ENABLED
      # Taken from the web service rather than generated: two different keys
      # would be two different signing secrets for the same data.
      - key: SECRET_KEY
        fromService:
          name: promop
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: promop-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: promop-redis
          type: redis
          property: connectionString
      - key: SENTRY_DSN
        fromService:
          name: promop
          type: web
          envVarKey: SENTRY_DSN
      - key: SENTRY_ENVIRONMENT
        value: production

  - type: redis
    name: promop-redis
    plan: starter
    # Reachable from the other services in this blueprint only.
    ipAllowList: []

  # Staging: existing web service; reuse its DATABASE_URL from Render.
  # Local access uses STAGING_DATABASE_URL in .env. Never commit its value.
  - type: web
    name: promop-staging
    runtime: python
    repo: https://github.com/healthkey-ai/promop
    branch: dev
    autoDeploy: true
    buildCommand: python scripts/verify_source_catalog_snapshots.py && pip install -r requirements.txt && python scripts/install_athena_browser.py && cd frontend && npm install && npm run build && cd .. && python manage.py
      collectstatic --noinput
    startCommand: chmod +x start.sh && ./start.sh
    envVars:
      # Keep Chromium inside the deployed Python environment, not a build-only cache.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: SECRET_KEY
        generateValue: true
      - key: AUDIT_HMAC_KEY
        generateValue: true
      - key: EXPORT_SIGNING_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: promop-staging-redis
          type: keyvalue
          property: connectionString
      - key: ALLOWED_HOSTS
        value: promop-staging.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://promop-staging.onrender.com
      - key: APP_BASE_URL
        value: https://promop-staging.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SERVICE_AUTH_TOKEN
        sync: false
      # The staging ETL capability is accepted only by explicitly approved
      # non-destructive write endpoints. It does not make the identity staff.
      - key: SERVICE_AUTH_SCOPES
        value: "patient/*.read system/etl.write"
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_SENDER_DOMAIN
        sync: false
      - key: PHR_AUDIENCE
        value: promop-api
      - key: PHR_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: promop-staging-redis
          type: keyvalue
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: staging
      # One switch per deployment; the worker pulls this exact value.
      - key: WEBHOOKS_ENABLED
        sync: false
    region: oregon
  - type: worker
    name: promop-staging-worker
    runtime: python
    repo: https://github.com/healthkey-ai/promop
    branch: dev
    region: oregon
    autoDeploy: true
    plan: 1c-2g
    buildCommand: python scripts/verify_source_catalog_snapshots.py && pip install -r requirements.txt && python scripts/install_athena_browser.py
    startCommand: bash start-worker.sh
    # Exactly one scheduler per deployment, as configuration rather than as a
    # comment: scaling this up means moving beat to its own service.
    numInstances: 1
    envVars:
      - key: CELERY_EMBEDDED_BEAT
        value: "true"
      - key: WEBHOOKS_ENABLED
        fromService:
          name: promop-staging
          type: web
          envVarKey: WEBHOOKS_ENABLED
      - key: SECRET_KEY
        fromService:
          name: promop-staging
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: promop-staging
          type: web
          envVarKey: DATABASE_URL
      - key: AUDIT_HMAC_KEY
        fromService:
          name: promop-staging
          type: web
          envVarKey: AUDIT_HMAC_KEY
      - key: EXPORT_SIGNING_KEY
        fromService:
          name: promop-staging
          type: web
          envVarKey: EXPORT_SIGNING_KEY
      - key: ANTHROPIC_API_KEY
        fromService:
          name: promop-staging
          type: web
          envVarKey: ANTHROPIC_API_KEY
      # Keep Chromium inside the deployed Python environment, not a build-only cache.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DEBUG
        value: 'False'
      - key: CELERY_BROKER_URL
        fromService:
          name: promop-staging-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: promop-staging-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_WORKER_CONCURRENCY
        value: '1'
      - key: CELERY_WORKER_PREFETCH_MULTIPLIER
        value: '1'
      - key: SENTRY_DSN
        fromService:
          name: promop-staging
          type: web
          envVarKey: SENTRY_DSN
      - key: SENTRY_ENVIRONMENT
        value: staging
  - type: keyvalue
    name: promop-staging-redis
    region: oregon
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: promop-db
    databaseName: promop
    user: promop
