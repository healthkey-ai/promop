services:
  - type: web
    name: promop
    runtime: python
    repo: https://github.com/healthkey-ai/promop
    branch: main
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .. && python manage.py collectstatic --noinput"
    startCommand: "chmod +x start.sh && ./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: promop-db
          property: connectionString

databases:
  - name: promop-db
    databaseName: promop
    user: promop
