[pytest]
DJANGO_SETTINGS_MODULE = ctomop.settings
# e2e needs a broker and a worker subprocess, so it is opt-in: CI runs it
# in its own job with `-m e2e`, which replaces this selection.
addopts = --no-migrations -m "not e2e"
testpaths = tests
markers =
    e2e: needs a live Redis broker and a Celery worker
