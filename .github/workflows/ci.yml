name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: promop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/promop_test
      SECRET_KEY: ci-secret-key
      DEBUG: 'True'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pytest runs with --no-migrations, so the test DB is built by reflecting
      # model state. That recreates concept's GIN trigram index during CREATE
      # TABLE, inside pytest-django's base django_db_setup fixture — before any
      # fixture override could enable the extension. Enabling it on template1
      # instead means every database cloned from it already has pg_trgm, which
      # is what conftest.py prescribes as the required environment setup.
      - name: Enable pg_trgm on template1 (required by the pytest suite)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run production deploy checks
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-deploy-check-secret-key-not-for-runtime-4f942b6e9d714aca
          ALLOWED_HOSTS: promop.example.invalid
          CORS_ALLOWED_ORIGINS: https://promop.example.invalid
          AUDIT_HMAC_KEY: ci-audit-hmac-key-not-for-runtime
          EXPORT_SIGNING_KEY: ci-export-signing-key-not-for-runtime
        run: python manage.py check --deploy --fail-level ERROR

      - name: Run tests (Django runner)
        run: python manage.py test omop_core patient_portal --verbosity=2 --noinput

      # The tests/ package is pytest-based (pytest.ini sets testpaths = tests,
      # conftest.py does session-level DB setup that --no-migrations skips).
      # Django's runner does not discover it, so these 166 tests ran in CI for
      # the first time here — they had been green-by-omission, and were in fact
      # 14-of-15 red in tests/test_enrich_breast_cancer_omop_data.py after #413
      # expanded WEARABLE_CONCEPT_CODE without anyone noticing.
      - name: Run tests (pytest)
        run: pytest -q

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci installs exactly the versions pinned in package-lock.json.
        # `npm install` re-resolves `^` ranges to the latest match, so a new
        # transitive/patch release (e.g. an eslint plugin) could change lint
        # behaviour between runs and diverge from local — use the lockfile.
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Test
        run: cd frontend && npm test

      - name: Type check & build
        run: cd frontend && npm run build

  security:
    name: Security gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip, so a secret committed and
          # then removed in a later commit is still caught.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tooling
        run: pip install pip-audit bandit

      # Dependency CVEs. Blocking on purpose: Dependabot raises advisory PRs but
      # does not stop a merge, and the SOC2 gap analysis notes those PRs going
      # unmerged. If this fails, upgrade the dependency — reach for
      # --ignore-vuln only when there is no fixed version, and say why.
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

      # Python SAST. Baselined: the codebase carries ~57 MEDIUM findings that are
      # false positives for its shape (SQL built by string concatenation in
      # vocabulary loading, temp-directory paths). The baseline makes this gate
      # mean "no NEW findings", which is the version that stays switched on.
      # Regenerate deliberately, never to silence a real finding:
      #   bandit -q -r <apps> -ll -x '*/tests.py,*/tests/*,*/migrations/*' \
      #     -f json -o .bandit-baseline.json
      # bandit's own exit code does not reflect baseline-filtered results — it
      # reports the new finding and still exits 0 — so the gate reads the JSON
      # and fails explicitly. Verified by planting a finding and watching this
      # step go red.
      - name: Python SAST (bandit)
        run: |
          bandit -q -r omop_core patient_portal ctomop omop_oncology omop_genomics \
            -ll -x '*/tests.py,*/tests/*,*/migrations/*' \
            -b .bandit-baseline.json -f json -o bandit-new.json || true
          python - <<'CHECK'
          import json, sys
          results = json.load(open('bandit-new.json'))['results']
          for r in results:
              print(f"{r['issue_severity']} {r['test_id']} "
                    f"{r['filename']}:{r['line_number']}  {r['issue_text']}")
          print(f"{len(results)} finding(s) not in the baseline")
          sys.exit(1 if results else 0)
          CHECK

      # Committed credentials. Config at .gitleaks.toml allowlists test fixtures;
      # a real secret is rotated, not allowlisted.
      - name: Secret scan (gitleaks)
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose
