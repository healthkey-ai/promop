on:
  push:
    branches:
      - main
      - dev

jobs:
  paper:
    runs-on: ubuntu-24.04
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf
