name: Deploy to Staging

on:
  push:
    branches: [dev]
  # Deploy a branch to staging without merging: add the 'deploy-staging' label
  # to its PR. The pull_request ref is what GCP's trust condition allows, so a
  # plain branch push cannot authenticate.
  pull_request:
    types: [labeled, synchronize]

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REPO: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ht-phr
  SERVICE_NAME: ctomop-staging
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    if: github.ref_name == 'dev'
    uses: ./.github/workflows/ci.yml

  # Builds alongside the tests rather than after them: only the deploy job
  # waits on the tests, so a failing suite still stops the release but the
  # build no longer adds its minutes to theirs. The image is pushed under the
  # commit SHA only; :latest moves in the deploy job, once tests have passed.
  build:
    name: Build image
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'deploy-staging')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Publisher catalogs must be real payloads in the migration image.
          lfs: true

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      # Layer cache lives in Artifact Registry beside the image, so pip install,
      # the model download and npm ci are reused until their inputs change.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gcp
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: GIT_COMMIT=${{ env.IMAGE_TAG }}
          tags: ${{ env.ARTIFACT_REPO }}/ctomop:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.ARTIFACT_REPO }}/ctomop:buildcache
          cache-to: type=registry,ref=${{ env.ARTIFACT_REPO }}/ctomop:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  # Serialised here, not on the workflow: at workflow level every pull_request
  # event joined the queue, so an unlabelled PR that never deploys waited
  # behind a running deploy and could displace a pending one.
  deploy:
    name: Deploy
    needs: [test, build]
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev --quiet

      # A manifest push, not `gcloud artifacts docker tags add`: moving a tag
      # that way needs artifactregistry.tags.delete, which the deploy account
      # does not have.
      - name: Tag image as latest
        run: |
          docker buildx imagetools create \
            -t ${ARTIFACT_REPO}/ctomop:latest \
            ${ARTIFACT_REPO}/ctomop:${IMAGE_TAG}

      - name: Deploy new revision (no traffic)
        run: |
          gcloud run services update ${SERVICE_NAME} \
            --image ${ARTIFACT_REPO}/ctomop:${IMAGE_TAG} \
            --region ${GCP_REGION} \
            --no-traffic --quiet

      - name: Run database migrations
        run: |
          gcloud run jobs update ${SERVICE_NAME}-migrate \
            --image ${ARTIFACT_REPO}/ctomop:${IMAGE_TAG} \
            --region ${GCP_REGION} --quiet
          gcloud run jobs execute ${SERVICE_NAME}-migrate \
            --region ${GCP_REGION} --wait --quiet

      # The worker pool runs the same image but is a separate resource, so
      # without this it keeps whatever it was created with. Guarded because it
      # is created by Terraform in the infra repo, which may not have been
      # applied yet.
      - name: Deploy worker revision
        run: |
          if gcloud run worker-pools describe ${SERVICE_NAME}-worker \
              --region ${GCP_REGION} >/dev/null 2>&1; then
            gcloud run worker-pools update ${SERVICE_NAME}-worker \
              --image ${ARTIFACT_REPO}/ctomop:${IMAGE_TAG} \
              --region ${GCP_REGION} --quiet
          else
            echo "No ${SERVICE_NAME}-worker pool yet — skipping."
          fi

      - name: Shift traffic to new revision
        run: |
          gcloud run services update-traffic ${SERVICE_NAME} \
            --to-latest --region ${GCP_REGION} --quiet
