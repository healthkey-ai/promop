name: Security review policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  issues:
    types: [labeled, unlabeled, edited, closed, reopened]
  workflow_run:
    workflows: [Security review updates]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-review-policy
  cancel-in-progress: false

jobs:
  # The policy's own tests run in a job with no write permissions of any kind.
  # They used to run as the first step of the job that later writes commit
  # statuses, which made `.github/scripts/security-review.test.cjs` — a file the
  # policy classified as test-only, and so mergeable without security approval —
  # arbitrary code execution inside the job that publishes the gate's verdict.
  policy-tests:
    runs-on: ubuntu-latest
    # Read-only: enough for actions/checkout, nothing that can publish a verdict.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test review policy
        run: node --test .github/scripts/security-review.test.cjs

  review:
    needs: policy-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      # Always execute policy from the trusted default branch, never PR code.
      # Only the policy module is checked out here; its test file is not, so
      # nothing in this job executes outside security-review.cjs itself.
      #
      # Both jobs resolve the default branch independently rather than pinning
      # the commit the tests ran against: a dynamic `ref:` in a
      # pull_request_target workflow is an untrusted checkout to CodeQL
      # (actions/untrusted-checkout/critical), even when the value comes from a
      # trusted job. A push to the default branch between the two jobs is the
      # residual gap, and both commits are trusted code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/security-review.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await require('./.github/scripts/security-review.cjs').run({ github, context, core });
